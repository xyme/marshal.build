name: CLA
# Contributor License Agreement check (CLA.md). On a contributor's first pull
# request the bot comments with the sentence to reply with; the reply records a
# signature in .github/cla-signatures.json on the `cla-signatures` branch.
# One-time maintainer setup: create the `cla-signatures` branch (see
# CONTRIBUTING.md, "Maintainer notes").
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the commit behind the v2.6.1 tag: this third-party action
        # runs with contents: write under pull_request_target.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/xyme/marshal.build/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "dependabot[bot],github-actions[bot]"
          custom-notsigned-prcomment: >-
            Thank you for the contribution. Before we can merge it you need to
            sign the marshal.build Contributor License Agreement
            (https://github.com/xyme/marshal.build/blob/main/CLA.md). Read it,
            then reply to this pull request with the exact sentence below.
            You only need to do this once.
          custom-allsigned-prcomment: "All contributors have signed the marshal.build CLA."
          lock-pullrequest-aftermerge: false
