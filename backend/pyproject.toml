[project]
name = "marshal-backend"
version = "0.1.0"
description = "marshal control plane API (FastAPI)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "boto3>=1.34",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "sse-starlette>=2.1",
    "python-ulid>=2.7",
    "greenlet>=3.0",
    # PDF text extraction (pdf-docx-ingestion spec R2.3) — EXACT pin per the
    # supply-chain rule; pure Python, zero transitive deps on 3.12.
    "pypdf==6.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "cryptography>=42",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
